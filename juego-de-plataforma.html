<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Salto Estelar — 40 niveles</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#29346b,#0b1024 62%);font-family:system-ui,sans-serif;color:#fff}.game{width:min(100vw,960px);padding:14px}header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 4px 10px}h1{margin:0;font-size:clamp(1.1rem,3.5vw,1.8rem)}.by{display:block;color:#bfc8ff;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;margin-top:3px}.stats{display:flex;align-items:center;gap:13px;color:#ffe47a;font-weight:800}button{border:0;border-radius:9px;background:#ffcf54;padding:7px 10px;font:800 .9rem inherit;color:#27213f;cursor:pointer}canvas{display:block;width:100%;height:auto;border:4px solid #aab8ff;border-radius:16px;background:#121a46;box-shadow:0 18px 60px #0008;touch-action:none}.help{text-align:center;color:#d7dcff;font-size:.9rem;margin:10px 0 0}kbd{background:#353d78;border:1px solid #7380d4;border-radius:4px;padding:1px 5px}.controls{display:none;justify-content:space-between;align-items:end;margin:12px 4px 0;touch-action:none}.move{display:flex;gap:11px}.touch{width:68px;height:62px;border:2px solid #929eff;border-radius:15px;background:#373d88;color:#fff;font-size:1.9rem;box-shadow:inset 0 -4px #242961;user-select:none;-webkit-user-select:none}.touch.jump{width:88px;background:#d76464;border-color:#ffaaa1;box-shadow:inset 0 -4px #9f424d;font-size:1.15rem}.touch:active,.touch.pressed{transform:translateY(2px);filter:brightness(1.2)}@media(max-width:560px){.game{padding:8px}.stats{gap:7px;font-size:.78rem}button{padding:5px 7px}.by{font-size:.58rem}}@media(pointer:coarse),(max-width:700px){.controls{display:flex}.help{display:none}header{align-items:start}.stats{flex-wrap:wrap;justify-content:flex-end;max-width:55%}}
</style></head><body><main class="game"><header><div><h1>✦ Salto Estelar</h1><span class="by">Creado por Equipo Devs</span></div><div class="stats"><span id="level">Nivel 1/40</span><span id="stars">✦ 0</span><span id="deaths">↻ 0</span><button id="restart">Reiniciar</button></div></header><canvas id="game" width="900" height="540"></canvas><div class="controls" aria-label="Controles táctiles"><div class="move"><button class="touch" data-key="ArrowLeft" aria-label="Mover a la izquierda">←</button><button class="touch" data-key="ArrowRight" aria-label="Mover a la derecha">→</button></div><button class="touch jump" data-key="Space" aria-label="Saltar">SALTAR</button></div><p class="help"><kbd>←</kbd> <kbd>→</kbd> / <kbd>A</kbd> <kbd>D</kbd> para moverte · <kbd>Espacio</kbd>, <kbd>W</kbd> o <kbd>↑</kbd> para saltar</p></main><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),W=900,H=540,keys={};let level=1,deaths=0,player,plats,stars,goal,time=0,complete=false;
// Los diseños se escalan y se vuelven más exigentes cada cinco niveles.
const patterns=[[[0,500,170],[245,435,125],[440,365,118],[625,292,110],[770,220,105]],[[0,500,150],[210,420,95],[360,350,90],[510,280,85],[655,205,82],[795,135,80]],[[0,500,135],[180,445,72],[315,375,68],[450,305,64],[585,235,60],[720,165,58],[842,95,55]],[[0,500,125],[175,410,75],[330,480,70],[465,385,68],[610,300,65],[750,210,60],[830,115,55]],[[0,500,120],[165,450,55],[285,380,53],[405,310,51],[525,240,49],[645,170,47],[765,100,45],[850,38,40]]];
function makeLevel(n){const p=patterns[Math.min(4,Math.floor((n-1)/8))];const shift=(n-1)%8*7;plats=p.map(([x,y,w],i)=>({x:Math.min(855,x+(i&&i<p.length-1?(i%2?shift:-shift):0)),y,w,h:i?18:40}));const last=plats[plats.length-1];goal={x:last.x+last.w-36,y:last.y-52,w:32,h:52};stars=plats.slice(1).map((p,i)=>({x:p.x+p.w/2,y:p.y-23,taken:false}));return plats}
function startLevel(){plats=makeLevel(level);player={x:45,y:440,w:26,h:34,vx:0,vy:0,ground:false,face:1};complete=false;updateUI()}
function updateUI(){document.querySelector('#level').textContent=`Nivel ${level}/40`;document.querySelector('#stars').textContent=`✦ ${stars.filter(s=>s.taken).length}/${stars.length}`;document.querySelector('#deaths').textContent=`↻ ${deaths}`}
function reset(){deaths++;startLevel()}function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function nextLevel(){if(level<40){level++;startLevel()}else{level=1;deaths=0;startLevel()}}addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','Space','KeyA','KeyD','KeyW'].includes(e.code))e.preventDefault();keys[e.code]=true;if(complete&&e.code==='Space')nextLevel()});addEventListener('keyup',e=>keys[e.code]=false);document.querySelector('#restart').onclick=()=>{deaths=0;startLevel()};document.querySelectorAll('[data-key]').forEach(b=>{let key=b.dataset.key;const down=e=>{e.preventDefault();if(complete&&key==='Space')nextLevel();keys[key]=true;b.classList.add('pressed')},up=e=>{e.preventDefault();keys[key]=false;b.classList.remove('pressed')};b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up)});
function update(){time++;if(complete)return;let l=keys.ArrowLeft||keys.KeyA,r=keys.ArrowRight||keys.KeyD;if(l){player.vx-=.75;player.face=-1}if(r){player.vx+=.75;player.face=1}player.vx=Math.max(-6.2,Math.min(6.2,player.vx*.8));if((keys.Space||keys.ArrowUp||keys.KeyW)&&player.ground){player.vy=-11.7;player.ground=false}player.vy=Math.min(15,player.vy+.62);player.x+=player.vx;for(const p of plats)if(hit(player,p)){player.x=player.vx>0?p.x-player.w:p.x+p.w;player.vx=0}player.y+=player.vy;player.ground=false;for(const p of plats)if(hit(player,p)){if(player.vy>0){player.y=p.y-player.h;player.ground=true}else player.y=p.y+p.h;player.vy=0}for(const s of stars)if(!s.taken&&Math.hypot(player.x+13-s.x,player.y+17-s.y)<25){s.taken=true;updateUI()}if(player.y>590||player.x<-30||player.x>930)reset();if(hit(player,goal)&&stars.every(s=>s.taken))complete=true}
function draw(){ctx.clearRect(0,0,W,H);let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#263778');g.addColorStop(1,'#10133a');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff8';for(let i=0;i<58;i++)ctx.fillRect((i*149)%W,(i*67)%390,(i%3)+1,(i%3)+1);ctx.fillStyle='#6974d2';ctx.beginPath();ctx.arc(785,82,49,0,7);ctx.fill();for(const p of plats){ctx.fillStyle='#51469f';ctx.fillRect(p.x,p.y,p.w,p.h);ctx.fillStyle='#a493ff';ctx.fillRect(p.x,p.y,p.w,5);ctx.fillStyle='#30276f';ctx.fillRect(p.x,p.y+p.h-4,p.w,4)}for(const s of stars)if(!s.taken){ctx.save();ctx.translate(s.x,s.y);ctx.rotate(time*.08);ctx.fillStyle='#ffe369';ctx.beginPath();for(let i=0;i<10;i++){let a=i*Math.PI/5-Math.PI/2,z=i%2?5:11;ctx.lineTo(Math.cos(a)*z,Math.sin(a)*z)}ctx.fill();ctx.restore()}ctx.fillStyle=stars.every(s=>s.taken)?'#7df2b2':'#6268a9';ctx.fillRect(goal.x,goal.y,goal.w,goal.h);ctx.fillStyle='#222555';ctx.fillRect(goal.x+7,goal.y+9,goal.w-14,goal.h-9);ctx.fillStyle='#ffdc62';ctx.fillRect(goal.x+23,goal.y+29,4,4);ctx.fillStyle='#ff866e';ctx.fillRect(player.x,player.y,player.w,player.h);ctx.fillStyle='#ffe6cf';ctx.fillRect(player.x+4,player.y+5,18,14);ctx.fillStyle='#292750';ctx.fillRect(player.x+(player.face>0?16:7),player.y+10,4,4);ctx.fillStyle='#fff';ctx.fillRect(player.x+3,player.y+27,8,7);ctx.fillRect(player.x+15,player.y+27,8,7);if(complete){ctx.fillStyle='#090d2ddd';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#fff7c5';ctx.font='bold 46px system-ui';ctx.fillText(level===40?'¡Has completado los 40 niveles!':'¡Nivel completado!',W/2,H/2-16);ctx.fillStyle='#e5e7ff';ctx.font='21px system-ui';ctx.fillText(level===40?'Pulsa Espacio para volver a empezar':'Pulsa Espacio para el siguiente nivel',W/2,H/2+28)}}function loop(){update();draw();requestAnimationFrame(loop)}startLevel();loop();
</script></body></html>
